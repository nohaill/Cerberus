<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cerberus // ops console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-border: #22262e;
    --text: #d7dbe0;
    --muted: #6b7280;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", sans-serif;
    --allow: #4ade80;
    --block: #f87171;
    --redact: #60a5fa;
    --escalate: #fbbf24;
    --accent: #ff6b4a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
    padding: 24px;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--panel-border);
  }
  h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  #status-line {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  #status-line .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--allow);
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
  }
  .stat-value.small { font-size: 18px; }

  .panels {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 16px;
  }
  .panel-title {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .feed {
    max-height: 420px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 12px;
  }
  .feed-row {
    display: grid;
    grid-template-columns: 70px 76px 1fr 60px;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--panel-border);
    align-items: center;
  }
  .feed-row:last-child { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .badge.allow { background: rgba(74,222,128,0.15); color: var(--allow); }
  .badge.block { background: rgba(248,113,113,0.15); color: var(--block); }
  .badge.redact { background: rgba(96,165,250,0.15); color: var(--redact); }
  .badge.escalate { background: rgba(251,191,36,0.15); color: var(--escalate); }
  .feed-time { color: var(--muted); font-size: 11px; }
  .feed-risk { color: var(--muted); }
  .feed-doc { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-state {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    padding: 24px 0;
    text-align: center;
  }
  canvas { max-height: 260px; }
</style>
</head>
<body>

<header>
  <h1>CERBERUS<span>::</span>ops console</h1>
  <div id="status-line"><span class="dot"></span><span id="status-text">connecting...</span></div>
</header>

<div class="grid">
  <div class="stat-card">
    <div class="stat-label">Requests (lifetime)</div>
    <div class="stat-value" id="stat-total">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">p50 / p99 latency</div>
    <div class="stat-value small" id="stat-latency">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Redactions (recent)</div>
    <div class="stat-value" id="stat-redactions">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Agent-resolved (recent)</div>
    <div class="stat-value" id="stat-agent">--</div>
  </div>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-title">Live decision feed</div>
    <div class="feed" id="feed"><div class="empty-state">waiting for requests...</div></div>
  </div>
  <div class="panel">
    <div class="panel-title">Verdict distribution (lifetime)</div>
    <canvas id="verdict-chart"></canvas>
  </div>
</div>

<script>
const VERDICT_COLORS = {
  allow: '#4ade80',
  block: '#f87171',
  redact: '#60a5fa',
  escalate: '#fbbf24',
};

let chart = null;

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0, 8);
}

function renderFeed(recent) {
  const feed = document.getElementById('feed');
  if (!recent || recent.length === 0) {
    feed.innerHTML = '<div class="empty-state">waiting for requests...</div>';
    return;
  }
  const rows = recent.slice().reverse().map(r => `
    <div class="feed-row">
      <span class="feed-time">${fmtTime(r.timestamp)}</span>
      <span class="badge ${r.verdict}">${r.verdict}</span>
      <span class="feed-doc">${r.matched_doc_id || ''}</span>
      <span class="feed-risk">${r.max_risk_score.toFixed(2)}</span>
    </div>
  `).join('');
  feed.innerHTML = rows;
}

function renderChart(verdictCounts) {
  const labels = Object.keys(verdictCounts);
  const data = Object.values(verdictCounts);
  const colors = labels.map(l => VERDICT_COLORS[l] || '#6b7280');

  if (!chart) {
    const ctx = document.getElementById('verdict-chart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
      options: {
        plugins: { legend: { position: 'bottom', labels: { color: '#d7dbe0', font: { family: 'ui-monospace', size: 11 } } } },
      },
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = data;
    chart.data.datasets[0].backgroundColor = colors;
    chart.update();
  }
}

async function poll() {
  try {
    const res = await fetch('/v1/stats');
    const s = await res.json();

    document.getElementById('status-text').textContent = 'live';
    document.getElementById('stat-total').textContent = s.total_requests_lifetime;
    document.getElementById('stat-latency').textContent =
      `${s.latency_p50_ms.toFixed(1)}ms / ${s.latency_p99_ms.toFixed(1)}ms`;
    document.getElementById('stat-redactions').textContent = s.redaction_count_recent;
    const agentResolved = Object.values(s.policy_doc_hits_recent || {}).reduce((a, b) => a + b, 0);
    document.getElementById('stat-agent').textContent = agentResolved;

    renderFeed(s.recent_requests);
    renderChart(s.verdict_counts_lifetime || {});
  } catch (e) {
    document.getElementById('status-text').textContent = 'disconnected';
  }
}

poll();
setInterval(poll, 3000);
</script>

</body>
</html>
